<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Conectar TikTok · Achadinhos Abessa</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff7f3; color: #2b2b2b; margin: 0; line-height: 1.6; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; text-align: center; }
  h1 { color: #b0294a; font-size: 1.5rem; }
  button { background: #b0294a; color: #fff; border: 0; border-radius: 12px; font-size: 1.2rem; padding: 16px 28px; cursor: pointer; }
  .ok { color: #1f9d55; font-weight: 600; }
  .erro { color: #b00020; }
</style>
</head>
<body>
<main>
<h1>Conectar o TikTok à Máquina</h1>
<div id="caixa"></div>
</main>
<script>
  // O código fica só nesta tela (não é enviado a lugar nenhum). Vale poucos minutos e uma vez só.
  const p = new URLSearchParams(location.search);
  const codigo = p.get('code');
  const caixa = document.getElementById('caixa');
  if (codigo) {
    caixa.innerHTML = '<p>Deu certo! Agora toque no botão abaixo e volte para o Claude.</p><p><button id="b">Copiar código</button></p><p id="m"></p>';
    document.getElementById('b').onclick = async () => {
      await navigator.clipboard.writeText(codigo);
      document.getElementById('m').innerHTML = '<span class="ok">Copiado! Volte para o Claude e diga "copiei o código do TikTok".</span>';
    };
    history.replaceState(null, '', location.pathname); // tira o código da barra de endereço
  } else {
    caixa.innerHTML = '<p class="erro">O TikTok não mandou o código' + (p.get('error') ? ' (' + p.get('error').replace(/[<>&"]/g, '') + ')' : '') + '. Tente autorizar de novo.</p>';
  }
</script>
</body>
</html>
