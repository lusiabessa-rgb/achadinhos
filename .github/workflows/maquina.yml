# Robô da Máquina de Ofertas: roda sozinho 2x por dia (7h e 18h de Brasília)
# ou quando você aperta "Run workflow" no GitHub (pelo celular também).
name: Maquina de Ofertas

on:
  # (horários desligados até as chaves estarem no cofre; religar depois)
  # schedule:
  #   - cron: "0 10 * * *"   # 7h em Brasília
  #   - cron: "0 21 * * *"   # 18h em Brasília
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: maquina
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
    env:
      TZ: America/Sao_Paulo
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y fonts-dejavu-core >/dev/null

      - name: Testes automaticos
        run: |
          node app/teste-automatico.js
          rm -rf publico/*/*-teste publico/*/*-teste.html

      - name: Cacar ofertas e fazer as artes
        run: |
          if [ -z "$SHOPEE_APP_ID" ]; then echo "Sem chaves da Shopee ainda: pulando a caca."; exit 0; fi
          # A 2a rodada do dia reaproveita as ofertas da manha (so publica o que faltou)
          if [ "$(cat publico/lusia/hoje.txt 2>/dev/null)" != "$(date +%F)" ]; then
            node app/maquina.js lusia
          fi

      - name: Salvar o que foi feito
        run: |
          git config user.name "maquina-de-ofertas"
          git config user.email "maquina@users.noreply.github.com"
          git add publico
          [ -f contas/lusia/historico.json ] && git add contas/lusia/historico.json
          git commit -m "Ofertas de $(date +%F)" || echo "nada novo"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico
      - uses: actions/deploy-pages@v4

      - name: Publicar no Instagram
        run: |
          if [ -z "$INSTAGRAM_TOKEN" ]; then echo "Sem token do Instagram ainda: pulando a publicacao."; exit 0; fi
          node app/publicar.js lusia

      - name: Salvar o que foi publicado
        if: always()
        run: |
          [ -f contas/lusia/publicados.json ] && git add contas/lusia/publicados.json
          git commit -m "Publicado em $(date '+%F %H:%M')" || echo "nada novo"
          git push || true
