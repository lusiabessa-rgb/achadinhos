# Robô da Máquina de Ofertas: roda sozinho 3x por dia nos horários de pico (12h, 18h e 20h de Brasília)
# ou quando você aperta "Run workflow" no GitHub (pelo celular também).
name: Maquina de Ofertas

on:
  # Horários automáticos (o GitHub pode atrasar alguns minutos)
  schedule:
    - cron: "0 15 * * *"   # 12h em Brasília (ofertas)
    - cron: "0 21 * * *"   # 18h em Brasília (ofertas)
    - cron: "0 23 * * *"   # 20h em Brasília (post de conteúdo: pessoas em casa no feed)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: maquina
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
    env:
      TZ: America/Sao_Paulo
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y fonts-dejavu-core >/dev/null

      - name: Testes automaticos
        run: |
          node app/teste-automatico.js
          rm -rf publico/*/*-teste publico/*/*-teste.html

      - name: Cacar ofertas e fazer as artes
        run: |
          # Sem chaves da Shopee: usa a lista manual (contas/lusia/shopee-produtos.txt), se tiver produto nela
          if [ -z "$SHOPEE_APP_ID" ] && ! grep -qv -e '^\s*#' -e '^\s*$' contas/lusia/shopee-produtos.txt 2>/dev/null; then
            echo "Sem chaves da Shopee e sem produtos na lista manual: pulando a caca."; exit 0
          fi
          # A 2a rodada do dia reaproveita as ofertas da manha (so publica o que faltou)
          if [ "$(cat publico/lusia/hoje.txt 2>/dev/null)" != "$(date +%F)" ]; then
            node app/maquina.js lusia
          fi

      - name: Preparar os posts de conteudo (sem venda)
        run: node app/conteudo.js lusia

      - name: Salvar o que foi feito
        run: |
          git config user.name "maquina-de-ofertas"
          git config user.email "maquina@users.noreply.github.com"
          git add publico
          if [ -f contas/lusia/historico.json ]; then git add contas/lusia/historico.json; fi
          git commit -m "Ofertas de $(date +%F)" || echo "nada novo"
          # o robô de respostas também salva coisas: junta antes de enviar
          git pull --rebase --autostash -q && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico
      - uses: actions/deploy-pages@v4

      - name: Publicar no Instagram
        run: |
          if [ -z "$INSTAGRAM_TOKEN" ]; then echo "Sem token do Instagram ainda: pulando a publicacao."; exit 0; fi
          node app/publicar.js lusia

      - name: Salvar o que foi publicado
        if: always()
        run: |
          if [ -f contas/lusia/publicados.json ]; then git add contas/lusia/publicados.json; fi
          git commit -m "Publicado em $(date '+%F %H:%M')" || echo "nada novo"
          (git pull --rebase --autostash -q && git push) || true
