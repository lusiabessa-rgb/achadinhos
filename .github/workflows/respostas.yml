# Robô de respostas: a cada 15 minutos olha os comentários do Instagram.
# Quem comentou "QUERO" recebe o link no direct. Só funciona com "respostas": { "ativo": true } no config.json.
name: Respostas QUERO

on:
  schedule:
    - cron: "*/15 * * * *"   # o GitHub pode atrasar alguns minutos
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: respostas
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Ligado?
        id: ligado
        run: |
          if node -e "const c=require('./contas/lusia/config.json'); process.exit(c.instagram && c.instagram.respostas && c.instagram.respostas.ativo ? 0 : 1)"; then
            echo "sim=1" >> "$GITHUB_OUTPUT"
          else
            echo "Resposta automática desligada no config.json: nada a fazer."
          fi
      - uses: actions/setup-node@v5
        if: steps.ligado.outputs.sim == '1'
        with:
          node-version: 24
          cache: npm
      - if: steps.ligado.outputs.sim == '1'
        run: npm ci
      - name: Responder comentários
        if: steps.ligado.outputs.sim == '1'
        run: node app/respostas.js lusia
      - name: Salvar quem já foi respondido
        if: always() && steps.ligado.outputs.sim == '1'
        run: |
          git config user.name "maquina-de-ofertas"
          git config user.email "maquina@users.noreply.github.com"
          if [ -f contas/lusia/respondidos.json ]; then git add contas/lusia/respondidos.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Respostas QUERO $(date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && exit 0; sleep 5; done
          exit 1
